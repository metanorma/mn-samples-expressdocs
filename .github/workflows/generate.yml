# Adapted from the cimas mn-samples generate template. Deviation: the
# corpus builds through bundler (ruby/setup-ruby + bundle install) with
# use-bundler, because it needs metanorma-cli main (github main) for the
# suma dispatch that renders schema_docs/plain_schemas; the standalone
# metanorma install cannot build it.
name: generate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-generate:
    name: Generate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: '${{ github.workflow }}-${{ matrix.os }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Bundle install
        run: bundle install --jobs 4

      - name: Metanorma generate site
        uses: actions-mn/build-and-publish@main
        with:
          agree-to-terms: true
          use-bundler: true
          destination: artifact
          artifact-name: ${{ github.event.repository.name }}-${{ runner.os }}
